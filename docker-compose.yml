services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code (hot reload)
      - .:/app
      # Keep node_modules and .next inside the container volume, do NOT overwrite with host
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true