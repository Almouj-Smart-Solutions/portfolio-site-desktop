  <g
     id="layer-MC0"
     inkscape:groupmode="layer"
     inkscape:label="text">
    <text
       id="text1"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,525.62893,823.55693)"><tspan
         id="tspan1"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">figure 1 of 30</tspan><tspan
         id="tspan2"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="12.141"
         y="10.8">writing</tspan><tspan
         id="tspan3"
         style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="11.133"
         y="21.6">prologue</tspan></text>
    <text
       id="text3"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,269.4564,165.07773)"><tspan
         id="tspan4"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">This project harnesses the critical imagination to generate communities without bound-</tspan><tspan
         id="tspan5"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="13.2">aries through artivism, providing a more dignified and respectful co-learning environ-</tspan><tspan
         id="tspan6"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="205.106"
         y="26.4">ment.</tspan><tspan
         id="tspan7"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="66">Originating in local art and rural artisanal craft, this project aims to put architecture into </tspan><tspan
         id="tspan8"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="79.199997">effect as a tool for communication to bring two communities that were initially one and </tspan><tspan
         id="tspan9"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="92.400002">have been separated in recent decades due to political and governmental issues into a </tspan><tspan
         id="tspan10"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="105.6">closer and more meaningful relationship with each other. Parallel to architecture, the proj-</tspan><tspan
         id="tspan11"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="118.8">ect intrinsically challenges group work during material gathering, tries to wholly involve </tspan><tspan
         id="tspan12"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="132">society in the construction, and at the stage of making use of it, it unbiasedly embraces </tspan><tspan
         id="tspan13"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="145.2">generational diversity through an educational enfilade. All these three contributions focus </tspan><tspan
         id="tspan14"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="158.39999">on the “construction of place” through social practices, perpetuating a cultural tradition </tspan><tspan
         id="tspan15"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="136.554"
         y="171.60001">rather than individual experience. </tspan><tspan
         id="tspan16"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="198">Nestled amid a magnificent rolling countryside, the project consists of two main bodies; a </tspan><tspan
         id="tspan17"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="211.2">porous plinth and a general volume. The curvilinear plinth is constructed on the wooden </tspan><tspan
         id="tspan18"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="224.39999">beams partially covered with salt residues, while the C-shaped volume is composed of two </tspan><tspan
         id="tspan19"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="237.60001">row constituents itself; a central layer and a peripheral layer. These two are separated by a </tspan><tspan
         id="tspan20"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="250.8">sequence of columns joined by a spine and a mono-pitched roof on one of its layers. The </tspan><tspan
         id="tspan21"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="264">peripheral layer is closed elevationally and its only apertures are the ribbon windows </tspan><tspan
         id="tspan22"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="277.20001">stretching all the way across one of its facades to frame views toward the lake and its open </tspan><tspan
         id="tspan23"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="290.39999">roof is actually a mediator for the plan's dialogue with the sky. This juxtaposition of filled </tspan><tspan
         id="tspan24"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="303.60001">and emptiness is inverted in the central layer so that this layer is the one that is roofed and </tspan><tspan
         id="tspan25"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="95.875999"
         y="316.79999">its facade is entirely open to reframe the first layer. </tspan><tspan
         id="tspan26"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="343.20001">Before addressing the two main components that make up the entire building and describ-</tspan><tspan
         id="tspan27"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="356.39999">ing their function, we will consider the site and its role in forming the geometric structure </tspan><tspan
         id="tspan28"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="369.60001">of the volume. The site is generously plain with the exception of two small mountain ranges </tspan><tspan
         id="tspan29"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="382.79999">at the top and bottom, allowing the building to bring in the landscape from all four direc-</tspan><tspan
         id="tspan30"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="396">tions. Although the research that was conducted to plan the procurement of raw materials </tspan><tspan
         id="tspan31"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="409.20001">for constructing the building benefits many areas around the site, such as Shiraz and Kavar </tspan><tspan
         id="tspan32"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="19.118"
         y="422.39999">cities, its usage is only for people living in Maharlou village and Sarvestan county. </tspan></text>
  </g>
