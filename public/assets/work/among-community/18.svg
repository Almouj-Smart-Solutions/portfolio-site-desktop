    <text
       id="text1"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,525.62893,823.55693)"><tspan
         id="tspan1"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">figure 1 of 30</tspan><tspan
         id="tspan2"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="12.141"
         y="10.8">writing</tspan><tspan
         id="tspan3"
         style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-6.0840001"
         y="21.6">design description</tspan></text>
    <text
       id="text3"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,458.6296,218.26133)"><tspan
         id="tspan4"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">Project’s Personality; a Gestalt:</tspan><tspan
         id="tspan5"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="39.599998">Subsequently, by challenging the principles of proxemics, the project’s microscopic </tspan><tspan
         id="tspan6"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="52.799999">approach seeks to explain how users organize movable and scalable elements into recog-</tspan><tspan
         id="tspan7"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="66">nizable patterns in plan through forming relationships between themselves. By preparing </tspan><tspan
         id="tspan8"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="79.199997">an educational environement that fosters proximity and connectivity, these patterns are </tspan><tspan
         id="tspan9"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="92.400002">designed in a fluid manner. Despite the lower statistics in population and area, the project </tspan><tspan
         id="tspan10"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="105.6">takes pride in its exploration by making users notice that the newly formed community </tspan><tspan
         id="tspan11"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-122.419"
         y="118.8">based on these relationships is greater than the sum of two communities, a gestalt.</tspan><tspan
         id="tspan12"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-87.384003"
         y="184.8">Project’s Appearance; a combination of locality and hyperlocality:</tspan><tspan
         id="tspan13"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="224.39999">While the project’s personality takes a rigorous look at its downstream and upstream com-</tspan><tspan
         id="tspan14"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="237.60001">munity, its appearance retains an air of ease in its environment and projects a subtle aware-</tspan><tspan
         id="tspan15"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="250.8">ness of its context, not just ecological but limnological and meteorological. The school’s roof </tspan><tspan
         id="tspan16"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="264">was originally conceived out of steel. Due to transportation limitations and sustainable </tspan><tspan
         id="tspan17"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="277.20001">considerations, we opted for precast wooden slabs with a raked texture, whose formal </tspan><tspan
         id="tspan18"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-141.87801"
         y="290.39999">language echoes the Local product-selling gazebo’s roof visible everywhere on both sides </tspan><tspan
         id="tspan19"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="9.1850004"
         y="303.60001">(communities) of Maharlou.</tspan></text>
  </g>
