  <g
     id="layer-MC0"
     inkscape:groupmode="layer"
     inkscape:label="text">
    <text
       id="text1"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,522.62893,823.55693)"><tspan
         id="tspan1"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">figure 10 of 30</tspan><tspan
         id="tspan2"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="14.391"
         y="10.8">writing</tspan><tspan
         id="tspan3"
         style="font-style:italic;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:9px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000000;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-3.8340001"
         y="21.6">design description</tspan></text>
    <text
       id="text3"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,462.68613,205.174)"><tspan
         id="tspan4"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">Two accents, Same Language:</tspan><tspan
         id="tspan5"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="39.599998">Dressed in two different accents, these building components develop a language in which </tspan><tspan
         id="tspan6"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="52.799999">they stand on the same plan but are counterpointed by each other. In fact, they formally </tspan><tspan
         id="tspan7"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="66">materialize abstract alienation rooted in two communities and continually evolve over time </tspan><tspan
         id="tspan8"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="79.199997">and participation to reflect their problem-solving potential via plan design. They polarize </tspan><tspan
         id="tspan9"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="92.400002">socio-political inequalities through solid and void, alternatively emphasizing the inner </tspan><tspan
         id="tspan10"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="105.6">programs of each, drawing attention to reciprocity. In one of them, space gives the ability </tspan><tspan
         id="tspan11"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="118.8">to objects to exist; in the other, objects enable space to be, and in reading this language, the </tspan><tspan
         id="tspan12"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-75.723999"
         y="132">subject gives the meanings of &quot;being&quot; and &quot;becoming&quot; to both.</tspan><tspan
         id="tspan13"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="158.39999">In both of them, the single sequences of the plan act as the vocabulary of the language and </tspan><tspan
         id="tspan14"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="171.60001">play the role of the most important element of the project, helping other elements, </tspan><tspan
         id="tspan15"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="184.8">including columns, doors, and curtains, free themselves from the fixed state by turning into </tspan><tspan
         id="tspan16"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="198">space-organizer and space-maker components in the form of ready-mades. From a </tspan><tspan
         id="tspan17"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="211.2">macroscopic point of view, by arranging and building the classrooms’ boundary using </tspan><tspan
         id="tspan18"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="224.39999">stochastic or definite spatial layouts with these ready-mades, the plan is understood in </tspan><tspan
         id="tspan19"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-144.925"
         y="237.60001">such a way that the entire structure as an object is manifested in every single sequence of it </tspan><tspan
         id="tspan20"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="-123.453"
         y="250.8">which is set up, shrunk, expanded, and dismantled with the cooperation of users. </tspan></text>
  </g>
