    <text
       id="text3"
       xml:space="preserve"
       transform="matrix(1.3333333,0,0,1.3333333,269.4564,329.07387)"><tspan
         id="tspan4"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="0">Cannibalizing the existing built environment’s waste to re-incorporate in the newly </tspan><tspan
         id="tspan5"
         style="font-variant:normal;font-weight:700;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="142.802"
         y="13.2">constructed building’s weight:</tspan><tspan
         id="tspan6"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="52.799999">The research through which we planned to source materials needed for the project was </tspan><tspan
         id="tspan7"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="66">based upon involving 3 groups of society neighboring the site, facilitating geographies of </tspan><tspan
         id="tspan8"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="79.199997">co-working. We considered the impacts of this scheme through a systematic need for social </tspan><tspan
         id="tspan9"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="92.400002">change by enabling a circular material-gathering and -reusing paradigm. So, the results not </tspan><tspan
         id="tspan10"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="105.6">only re-integrate each individual’s personal space and social space created originally </tspan><tspan
         id="tspan11"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="118.8">through the proxemics sphere under racial impositions but also lurk in the shadow of </tspan><tspan
         id="tspan12"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="0"
         y="132">waste management and resource recovery as an environmentally preferable alternative to </tspan><tspan
         id="tspan13"
         style="font-variant:normal;font-weight:normal;font-stretch:normal;font-size:11px;font-family:'Book Antiqua';writing-mode:lr-tb;fill:#000100;fill-opacity:1;fill-rule:nonzero;stroke:none"
         x="187.649"
         y="145.2">construction.</tspan></text>
