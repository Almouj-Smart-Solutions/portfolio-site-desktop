services:
  web:
    image: ${IMAGE:-portfolio-site:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-file:/data/portfolio.db}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
      SEED_FORCE: ${SEED_FORCE:-}
    volumes:
      - portfolio_data:/data
      - work_uploads:/app/public/assets/work
    ports:
      - "${WEB_PORT:-8084}:3000"
    expose:
      - "3000"
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    cpus: ${WEB_CPUS:-0.75}

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
  portfolio_data:
  work_uploads:
